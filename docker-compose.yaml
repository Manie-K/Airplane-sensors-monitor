services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: airplane-sensors-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MongoDb: mongodb://mongo:27017/sensors
      Mqtt__Host: mosquitto
      Mqtt__Port: 1883
      Mqtt__TopicFilter: sensors/#
      Mqtt__ClientId: razor-client-compose
    ports:
      - "8080:8080"
    depends_on:
      - mongo
      - mosquitto
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  blockchain:
    image: trufflesuite/ganache
    container_name: ganache
    ports:
      - "8545:8545"
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--accounts"
      - "10"
      - "--deterministic"
    depends_on:
      - mongo
      - mosquitto
    restart: unless-stopped

  co2-datagenerator:
    build:
      context: .
      dockerfile: dataGenerator/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      HOST: mosquitto
      PORT: 1883
      DATA_MIN: 400
      DATA_MAX: 1200
      INTERVAL: 1.0
      SENSOR_ID: "1"
      SENSOR_TYPE: CO2
    deploy:
      replicas: 1
    depends_on:
      - mosquitto
      - backend

  temp-datagenerator:
    build:
      context: .
      dockerfile: dataGenerator/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      HOST: mosquitto
      PORT: 1883
      DATA_MIN: 15
      DATA_MAX: 35
      INTERVAL: 1.0
      SENSOR_ID: "1"
      SENSOR_TYPE: TEMPERATURE
    deploy:
      replicas: 1
    depends_on:
      - mosquitto
      - backend

  press-datagenerator:
    build:
      context: .
      dockerfile: dataGenerator/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      HOST: mosquitto
      PORT: 1883
      DATA_MIN: 980
      DATA_MAX: 1020
      INTERVAL: 1.0
      SENSOR_ID: "1"
      SENSOR_TYPE: PRESSURE
    deploy:
      replicas: 1
    depends_on:
      - mosquitto
      - backend

  humi-datagenerator:
    build:
      context: .
      dockerfile: dataGenerator/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      HOST: mosquitto
      PORT: 1883
      DATA_MIN: 30
      DATA_MAX: 80
      INTERVAL: 1.0
      SENSOR_ID: "1"
      SENSOR_TYPE: HUMIDITY
    deploy:
      replicas: 1
    depends_on:
      - mosquitto
      - backend

volumes:
  mongo-data:
  mosquitto-data:
  mosquitto-log:
